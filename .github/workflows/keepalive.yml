# Pings the Render relay so the free web service never idles out (sleeps after 15 min).
# GitHub cron minimum is 5 min and can be delayed, so every 10 min leaves margin.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://agent-bridge-htg7.onrender.com/healthz
